<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ailexc · 简历下载</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f7fb; color: #12141a; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border: 1px solid #e6e8ef;
    border-radius: 18px; padding: 32px 28px;
    box-shadow: 0 16px 40px rgba(16,24,40,.08);
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg,#3155f5,#6d8bff); color: #fff; font-weight: 700; font-size: 20px;
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.3px; }
  p.sub { margin: 0 0 22px; color: #6b7280; font-size: 13.5px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: #344054; margin-bottom: 7px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; letter-spacing: .35em;
    border: 1px solid #d0d5dd; border-radius: 11px; outline: none; background: #fff;
  }
  input:focus { border-color: #4f7bff; box-shadow: 0 0 0 4px rgba(79,123,255,.14); }
  button {
    width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 11px;
    background: linear-gradient(135deg,#3155f5,#6d8bff); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .err { margin-top: 12px; color: #d92d20; font-size: 13px; }
  .hint { margin-top: 18px; color: #98a2b3; font-size: 12px; line-height: 1.7; }
  .ok { color: #067647; font-size: 14px; line-height: 1.8; }
  a.dl {
    display: inline-block; margin-top: 16px; padding: 11px 18px; border-radius: 11px;
    background: #3155f5; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600;
  }
  .lang { position: fixed; top: 18px; right: 18px; font-size: 12px; color: #6b7280; }
  .lang a { color: #3155f5; text-decoration: none; margin-left: 6px; }
</style>
</head>
<body>
<div class="lang"><a href="/resume?lang=en">EN</a> · <a href="/resume?lang=zh">中文</a></div>
<div class="card">
  <div class="mark">a</div>
  <h1>{TITLE}</h1>
  <p class="sub">{SUBTITLE}</p>
  <form method="post" action="/resume/verify">
    <input type="hidden" name="lang" value="{LANG}" />
    <label for="code">{LABEL}</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="off" maxlength="8" required autofocus />
    <button type="submit">{BUTTON}</button>
  </form>
  {ERROR}
  <p class="hint">{HINT}</p>
</div>
</body>
</html>
